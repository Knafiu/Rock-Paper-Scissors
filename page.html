<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>THE TITLE OF YOUR WEBPAGE</h1>
    <button id="Rock">Rock</button>
    <button id="Paper">Paper</button>
    <button id="Scissors">Scissors</button>
    <div class="res">Results</div>

    <script>
        ///get Computer Choice
        function getComputerChoice() {
            const randomNumber = Math.floor(Math.random() * 3);

            if (randomNumber === 0) {
                return "rock";
            } else if (randomNumber === 1) {
                return "paper";
            } else {
                return "scissors";
            }
        }

        let humanScore = 0;
        let computerScore = 0;
        function playGame() {
            // Step 4: Declare score variables inside playGame
            const result = document.querySelector(".res");


            function playRound(humanChoice, computerChoice) {
            const human = humanChoice.toLowerCase();     // make human choice case-insensitive
            const computer = computerChoice.toLowerCase();

            if (human === computer) {
                const tie = document.createElement("div");
                tie.classList.add("tie");
                tie.textContent = `It's a tie! You both chose ${human}.`;
                result.appendChild(tie);
                console.log(`It's a tie! You both chose ${human}.`);
                return;
            }
            const humanWins =
            (human === "rock" && computer === "scissors") ||
            (human === "paper" && computer === "rock") ||
            (human === "scissors" && computer === "paper");

            if (humanWins) {
            humanScore++;
            const hwin = document.createElement("div");
            hwin.classList.add("hwin");
            hwin.textContent = `You win this round! ${human} beats ${computer}.`;
            result.appendChild(hwin);
            console.log(`You win this round! ${human} beats ${computer}.`);
            } else {
            computerScore++;
            const cwin = document.createElement('div');
            cwin.classList.add("cwin");
            cwin.textContent = `You lose this round! ${computer} beats ${human}.`;
            result.appendChild(cwin)
            console.log(`You lose this round! ${computer} beats ${human}.`);
            }
            console.log(`Score — You: ${humanScore} | Computer: ${computerScore}`);
            checkGameOver();
        }

        
        const rock = document.getElementById("Rock");
        const paper = document.getElementById("Paper");
        const scissors = document.getElementById("Scissors");
        rock.addEventListener("click", () => playRound("rock", getComputerChoice()))
        scissors.addEventListener('click', ()=> playRound("scissors", getComputerChoice()))
        paper.addEventListener("click", ()=> playRound("paper", getComputerChoice()))
    
    }

    function checkGameOver(){
        const result = document.querySelector('.res');
        if (humanScore === 5){
        const score = document.createElement('div');
        score.classList.add('score');
        score.textContent = "Game Over. You Won!";
        result.appendChild(score);
        document.querySelectorAll("button").forEach(btn => btn.disabled = true);
    }
    else if (computerScore === 5){
        const com = document.createElement("div");
        com.classList.add('com');
        com.textContent = 'Game Over. You Lost!';
        result.appendChild(com);
        document.querySelectorAll("button").forEach(btn => btn.disabled = true);
    }
    }
    playGame()
    </script>
</body>
</html>
